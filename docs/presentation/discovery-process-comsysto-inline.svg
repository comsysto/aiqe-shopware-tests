<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 210 1840 700" width="1840" height="700" font-family="Inter, Helvetica, Arial, sans-serif">
  <!-- Comsysto Reply palette: blue #0f4f80 (Developer), cyan #76ccdb (Claude Code), muted #cbd5e1 (Java runner), ink #020617, surface #f1f5f9 -->
  <defs>
    <linearGradient id="loopGrad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#76ccdb"/>
      <stop offset="1" stop-color="#0f4f80"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="300%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#020617"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f4f80"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="40" y="210" width="1840" height="700" fill="#f1f5f9"/>

  <!-- Docker group -->
  <rect x="656" y="258" width="608" height="470" rx="30" fill="#94a3b8" fill-opacity="0.16" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="690" y="240" width="540" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="960" y="264" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">SHOPWARE 6 IN DOCKER · DOCKWARE/DEV VIA TESTCONTAINERS</text>

  <!-- Connectors -->
  <g stroke="#020617" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="338" y1="500" x2="372" y2="500"/>
    <line x1="640" y1="500" x2="674" y2="500"/>
    <line x1="942" y1="500" x2="976" y2="500"/>
    <line x1="1244" y1="500" x2="1278" y2="500"/>
    <line x1="1546" y1="500" x2="1580" y2="500"/>
  </g>

  <!-- ===== Card 1: Invoke (Developer) ===== -->
  <g filter="url(#shadow)">
    <rect x="80" y="300" width="250" height="400" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="104" y="300" width="64" height="5" rx="2.5" fill="#0f4f80"/>
  <text x="104" y="342" font-size="16" font-weight="700" fill="#0f4f80" letter-spacing="2">01</text>
  <g transform="translate(205,400)">
    <circle r="46" fill="#0f4f80"/>
    <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-22" y="-16" width="44" height="32" rx="5"/>
      <path d="M-12 -5 L-5 1 L-12 7"/>
      <line x1="-1" y1="8" x2="10" y2="8"/>
    </g>
  </g>
  <text x="205" y="490" font-size="28" font-weight="700" fill="#020617" text-anchor="middle">Invoke</text>
  <g font-size="18" fill="#334155" text-anchor="middle">
    <text x="205" y="528">Developer runs the</text>
    <text x="205" y="556" font-family="'JetBrains Mono', Consolas, monospace" fill="#0f4f80">/discover-tests</text>
    <text x="205" y="584">skill in Claude Code</text>
  </g>
  <rect x="150" y="642" width="110" height="30" rx="15" fill="#0f4f80"/>
  <text x="205" y="663" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Developer</text>

  <!-- ===== Card 2: Script (Skill) ===== -->
  <g filter="url(#shadow)">
    <rect x="382" y="300" width="250" height="400" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="406" y="300" width="64" height="5" rx="2.5" fill="#76ccdb"/>
  <text x="406" y="342" font-size="16" font-weight="700" fill="#0f4f80" letter-spacing="2">02</text>
  <g transform="translate(507,400)">
    <circle r="46" fill="#76ccdb"/>
    <g fill="none" stroke="#020617" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15 -22 H7 L17 -12 V22 H-15 Z"/>
      <path d="M7 -22 V-12 H17"/>
      <line x1="-8" y1="-2" x2="10" y2="-2"/>
      <line x1="-8" y1="6" x2="10" y2="6"/>
      <line x1="-8" y1="14" x2="3" y2="14"/>
    </g>
  </g>
  <text x="507" y="490" font-size="28" font-weight="700" fill="#020617" text-anchor="middle">Script</text>
  <g font-size="18" fill="#334155" text-anchor="middle">
    <text x="507" y="528">bootstrap.yml or a</text>
    <text x="507" y="556">new YAML crawl script</text>
  </g>
  <rect x="412" y="572" width="190" height="56" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <g font-size="15" fill="#020617" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">
    <text x="507" y="595">open · click · fill</text>
    <text x="507" y="617">wait · snapshot</text>
  </g>
  <rect x="417" y="642" width="180" height="30" rx="15" fill="#76ccdb"/>
  <text x="507" y="663" font-size="15" font-weight="600" fill="#020617" text-anchor="middle">Claude Code Skill</text>

  <!-- ===== Card 3: Crawl (Runner) ===== -->
  <g filter="url(#shadow)">
    <rect x="684" y="300" width="250" height="400" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="708" y="300" width="64" height="5" rx="2.5" fill="#94a3b8"/>
  <text x="708" y="342" font-size="16" font-weight="700" fill="#0f4f80" letter-spacing="2">03</text>
  <g transform="translate(809,400)">
    <circle r="46" fill="#cbd5e1"/>
    <g fill="none" stroke="#020617" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-24" y="-18" width="48" height="36" rx="5"/>
      <line x1="-24" y1="-8" x2="24" y2="-8"/>
    </g>
    <g fill="#020617">
      <circle cx="-18" cy="-13" r="1.8"/>
      <circle cx="-12" cy="-13" r="1.8"/>
      <circle cx="-6" cy="-13" r="1.8"/>
      <path d="M-3 -1 L-3 13 L1 9 L5 15 L8 13 L4 7 L9 6 Z"/>
    </g>
  </g>
  <text x="809" y="490" font-size="28" font-weight="700" fill="#020617" text-anchor="middle">Crawl</text>
  <g font-size="18" fill="#334155" text-anchor="middle">
    <text x="809" y="528">Boot a fresh</text>
    <text x="809" y="556">Shopware storefront,</text>
    <text x="809" y="584">Selenide executes</text>
    <text x="809" y="612">every script step</text>
  </g>
  <rect x="724" y="642" width="170" height="30" rx="15" fill="#cbd5e1"/>
  <text x="809" y="663" font-size="15" font-weight="600" fill="#020617" text-anchor="middle">DiscoveryRunner</text>

  <!-- ===== Card 4: Snapshot (Runner) ===== -->
  <g filter="url(#shadow)">
    <rect x="986" y="300" width="250" height="400" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="1010" y="300" width="64" height="5" rx="2.5" fill="#94a3b8"/>
  <text x="1010" y="342" font-size="16" font-weight="700" fill="#0f4f80" letter-spacing="2">04</text>
  <g transform="translate(1111,400)">
    <circle r="46" fill="#cbd5e1"/>
    <g fill="none" stroke="#020617" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-22" y="-12" width="44" height="30" rx="6"/>
      <path d="M-9 -12 L-5 -19 H5 L9 -12"/>
      <circle cx="0" cy="3" r="8"/>
    </g>
  </g>
  <text x="1111" y="490" font-size="28" font-weight="700" fill="#020617" text-anchor="middle">Snapshot</text>
  <g font-size="18" fill="#334155" text-anchor="middle">
    <text x="1111" y="528">DOM elements → .json</text>
    <text x="1111" y="556">Full page → .png</text>
  </g>
  <rect x="1016" y="580" width="190" height="34" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="1111" y="603" font-size="15" fill="#020617" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">build/discovery/</text>
  <rect x="1026" y="642" width="170" height="30" rx="15" fill="#cbd5e1"/>
  <text x="1111" y="663" font-size="15" font-weight="600" fill="#020617" text-anchor="middle">DiscoveryRunner</text>

  <!-- ===== Card 5: Analyze (Skill) ===== -->
  <g filter="url(#shadow)">
    <rect x="1288" y="300" width="250" height="400" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="1312" y="300" width="64" height="5" rx="2.5" fill="#76ccdb"/>
  <text x="1312" y="342" font-size="16" font-weight="700" fill="#0f4f80" letter-spacing="2">05</text>
  <g transform="translate(1413,400)">
    <circle r="46" fill="#76ccdb"/>
    <g stroke="#020617" stroke-width="3" stroke-linecap="round">
      <line x1="-14" y1="-11" x2="14" y2="-11"/>
      <line x1="-14" y1="-11" x2="0" y2="14"/>
      <line x1="14" y1="-11" x2="0" y2="14"/>
    </g>
    <g fill="#76ccdb" stroke="#020617" stroke-width="3">
      <circle cx="-14" cy="-11" r="7"/>
      <circle cx="14" cy="-11" r="7"/>
      <circle cx="0" cy="14" r="7"/>
    </g>
  </g>
  <text x="1413" y="490" font-size="28" font-weight="700" fill="#020617" text-anchor="middle">Analyze</text>
  <g font-size="18" fill="#334155" text-anchor="middle">
    <text x="1413" y="528">Cluster pages into</text>
    <text x="1413" y="556">user journeys and</text>
    <text x="1413" y="584">compare against</text>
    <text x="1413" y="612">existing specs</text>
  </g>
  <rect x="1323" y="642" width="180" height="30" rx="15" fill="#76ccdb"/>
  <text x="1413" y="663" font-size="15" font-weight="600" fill="#020617" text-anchor="middle">Claude Code Skill</text>

  <!-- ===== Card 6: Propose (Skill -> Developer) ===== -->
  <g filter="url(#shadow)">
    <rect x="1590" y="300" width="250" height="400" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="1614" y="300" width="64" height="5" rx="2.5" fill="#0f4f80"/>
  <text x="1614" y="342" font-size="16" font-weight="700" fill="#0f4f80" letter-spacing="2">06</text>
  <g transform="translate(1715,400)">
    <circle r="46" fill="#0f4f80"/>
    <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15 -22 H7 L17 -12 V22 H-15 Z"/>
      <path d="M7 -22 V-12 H17"/>
      <path d="M-7 4 L-2 9 L9 -3"/>
    </g>
  </g>
  <text x="1715" y="490" font-size="28" font-weight="700" fill="#020617" text-anchor="middle">Propose</text>
  <g font-size="18" fill="#334155" text-anchor="middle">
    <text x="1715" y="528">New or gap-update</text>
    <text x="1715" y="556">OpenSpec proposals,</text>
    <text x="1715" y="584">reviewed by the</text>
    <text x="1715" y="612">developer via PR</text>
  </g>
  <rect x="1625" y="642" width="180" height="30" rx="15" fill="#0f4f80"/>
  <text x="1715" y="663" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Skill → Developer</text>

  <!-- Round-model loop -->
  <path d="M1715 706 V790 Q1715 830 1675 830 H245 Q205 830 205 790 V716" fill="none" stroke="url(#loopGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12" marker-end="url(#arrowLoop)"/>
  <g filter="url(#shadow)">
    <rect x="610" y="808" width="700" height="44" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <circle cx="642" cy="830" r="6" fill="#76ccdb"/>
  <text x="960" y="837" font-size="19" fill="#020617" text-anchor="middle"><tspan font-weight="700">Round model</tspan> — one script per run, the developer steers the next round</text>

</svg>
